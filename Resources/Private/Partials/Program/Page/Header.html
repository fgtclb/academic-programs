<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    The header of the program page: a title and the subtitle.

    One element, because the page template renders it inside a reversed flex column
    together with the media: the image is shown above the header, the heading stays
    first in the document.
</f:comment>

<header class="ace-header">
    <h1 class="ace-title">{program.title}</h1>

    <f:if condition="{program.subtitle}">
        <p class="ace-subtitle">{program.subtitle}</p>
    </f:if>
</header>

</html>
