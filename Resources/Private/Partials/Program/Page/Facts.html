<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    The facts of the program page: its categories and the fixed list of program fields.
</f:comment>

<f:render
    partial="Program/Categories"
    arguments="{_all}"
/>

<ul>
    <f:for
        each="{
            0: 'creditPoints',
            1: 'jobProfile',
            2: 'performanceScope',
            3: 'prerequisites'
        }"
        as="attribute"
    >
        <f:if condition="{program.{attribute}}">
            <li>
                <b>{f:translate(key: 'program.{attribute}', extensionName: 'academic_programs')}</b>

                <span>{program.{attribute} -> f:format.raw()}</span>
            </li>
        </f:if>
    </f:for>
</ul>

</html>
