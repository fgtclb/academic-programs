<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:if condition="{programs}">
    <f:then>
        <div class="ace-itemlist">
            <div class="row">
                <f:for each="{programs}" as="program">
                    <div class="col-12 col-md-6 col-lg-4 col-xl-3">
                        <f:render
                            partial="Program/Item"
                            arguments="{_all}"
                        />
                    </div>
                </f:for>
            </div>
        </div>
    </f:then>
    <f:else>
        <span class="ace-empty">{f:translate(key: 'list.noProgramsFound', extensionName: 'AcademicPrograms')}</span>
    </f:else>
</f:if>

</html>
