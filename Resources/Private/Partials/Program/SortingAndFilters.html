<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:if condition="!{settings.hideSorting} || !{settings.hideFilter}">
    <f:form action="list" name="demand" object="{demand}" class="academic-programs-filtersorting">
        <div class="row">
            <f:if condition="!{settings.hideSorting}">
                <f:render
                    partial="Program/DemandSorting"
                    arguments="{_all}"
                />
            </f:if>

            <f:if condition="!{settings.hideFilter}">
                <f:render
                    partial="Program/DemandCategories"
                    arguments="{_all}"
                />
            </f:if>
        </div>
    </f:form>
</f:if>

<f:comment>
    The active filters, the reset link and the result count are switched on per site by
    `settings.filter.showActiveFilters`, `showReset` and `showResultCount`. The first two
    belong to the filter, so a list whose filter is hidden shows neither.
</f:comment>
<f:if condition="!{settings.hideFilter}">
    <f:if condition="{settings.filter.showActiveFilters} || {settings.filter.showReset}">
        <f:render
            partial="Program/ActiveFilters"
            arguments="{_all}"
        />
    </f:if>
</f:if>

<f:if condition="{settings.filter.showResultCount}">
    <f:render
        partial="Program/ResultCount"
        arguments="{count: '{programs -> f:count()}'}"
    />
</f:if>

</html>
