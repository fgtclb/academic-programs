<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    xmlns:ace="http://typo3.org/ns/FGTCLB/AcademicPrograms/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<article class="ace-card">
    <div class="ace-content">
        <header class="ace-header">
            <f:render
                partial="Program/Header"
                arguments="{
                    header: '{program.title}',
                    layout: '{data.header_layout}',
                    link: '{f:uri.page(pageUid: program.uid)}',
                    subheader: '{data.subheader}'
                }"
            />
        </header>

        <f:comment>
            The facts of the card, from the setting "plugin.tx_academicprograms.card.fields":
            the degree unless the setting names others. "facts.mostSpecificOnly" leaves out
            a category whose descendant the program carries as well.
        </f:comment>
        <f:variable name="cardFacts" value="{ace:program.facts(program: program, fields: settings.card.fields, mostSpecificOnly: settings.facts.mostSpecificOnly)}" />
        <f:render
            partial="Program/Facts"
            arguments="{
                facts: cardFacts,
                listClass: 'ace-properties',
                itemClass: 'ace-property'
            }"
        />
    </div>

    <f:for each="{program.media}" as="image" iteration="i">
        <f:if condition="{i.isFirst}">
            <f:comment>The shared partial of EXT:academic_base.</f:comment>
            <div class="ace-media">
                <f:render
                    partial="Academic/Image"
                    arguments="{
                        image: image,
                        preset: 'card',
                    }"
                />
            </div>
        </f:if>
    </f:for>
</article>

</html>
