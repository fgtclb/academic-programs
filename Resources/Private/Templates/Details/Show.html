<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    The facts of the program the content element sits on, from the setting
    "plugin.tx_academicprograms.facts.fields": every category type unless the setting
    names others.
</f:comment>

<div class="academic-programs-detail-categories">
    <f:if condition="{settings.renderContentElementHeader}">
        <f:render partial="Header/All" arguments="{_all}" />
    </f:if>

    <f:render
        partial="Program/Facts"
        arguments="{_all}"
    />
</div>

</html>
