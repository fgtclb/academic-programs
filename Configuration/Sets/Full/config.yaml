# Aggregate set: everything this extension ships, in one dependency.
#
# It carries no TypoScript and no page TSconfig of its own - each component is
# delivered by the set that owns it, and listing a payload here would parse the
# same files a second time.
#
# What it does carry is "settings.definitions.yaml": the settings are read
# through the shared TypoScript block of both components - by the page type, by
# both content elements or by the list - and a set definition can only declare
# them next to its own "config.yaml". A site that depends on a component set
# alone therefore still gets the defaults of
# "Configuration/TypoScript/constants.typoscript",
# but the settings are not declared for it: the site settings editor does not
# offer them and nothing validates them - depend on this set for that.
#
# The name is the one this extension published before the configuration was cut
# per component, so a site configuration that depends on it needs no change -
# both development instances of this repository do.
name: fgtclb/academic-programs
label: Academic Programs
dependencies:
  - fgtclb/academic-programs-program-list
  - fgtclb/academic-programs-program-details
