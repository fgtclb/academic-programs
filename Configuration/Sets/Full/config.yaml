# Aggregate set: everything this extension ships, in one dependency.
#
# It carries no TypoScript and no page TSconfig of its own - each component is
# delivered by the set that owns it, and listing a payload here would parse the
# same files a second time.
#
# The name is the one this extension published before the configuration was cut
# per component, so a site configuration that depends on it needs no change.
# Installations of the released 2.x line do, and so does the site configuration
# of the core-13 development instance. The name has to stay resolvable: on TYPO3
# v13 a site that depends on a set no active extension ships answers every page
# with HTTP 500 ("depends on unavailable sets").
name: fgtclb/academic-programs
label: Academic Programs
dependencies:
  - fgtclb/academic-programs-program-list
  - fgtclb/academic-programs-program-details
  - fgtclb/academic-programs-content-load
