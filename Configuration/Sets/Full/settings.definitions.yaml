# Site settings of the program page type, of the facts of a program and of the
# filters of the program list.
#
# Every path below is also assigned in
# "Configuration/TypoScript/constants.typoscript", and the default has to be the
# same in both files: a site that uses the site set and the static template
# reads the constants after the site settings, so a differing default resets
# what the integrator configured, silently.
#
# The file is declared with the aggregate set only - see "config.yaml" next to
# it for what that means for a site that depends on a single component.
categories:
  academic:
    label: 'Academic'
  academic.programs:
    label: 'Programs'
    parent: academic

settings:
  plugin.tx_academicprograms.page.layout:
    label: 'Program page | Page layout'
    description: 'The Fluid layout of the site package the program page renders its section "Main" into. The layout has to exist; only for "Default" does the extension bring a fallback, which renders the page without the frame of the site.'
    category: academic.programs
    type: string
    default: 'Default'
  plugin.tx_academicprograms.page.listPid:
    label: 'Program page | List page'
    description: 'The page the header of a program page links back to. 0 renders no link.'
    category: academic.programs
    type: int
    default: 0
  plugin.tx_academicprograms.facts.fields:
    label: 'Program facts | Facts of the program page and the details element'
    description: 'The facts the program page and the program details content element show, in this order, comma-separated: category type identifiers of the group "programs" (degree, standard_period, location, ...) and creditPoints, jobProfile, performanceScope, prerequisites. Empty: every category type, followed by the four program fields on the program page only.'
    category: academic.programs
    type: string
    default: ''
  plugin.tx_academicprograms.card.fields:
    label: 'Program facts | Facts of the program card'
    description: 'The facts each program card of the program list shows, in this order, with the same identifiers as the facts of the program page. Empty shows the degree.'
    category: academic.programs
    type: string
    default: 'degree'
  plugin.tx_academicprograms.filter.categoryTypes:
    label: 'Program list | Filter types'
    description: 'The category filters the program list offers, in this order, comma-separated: category type identifiers of the group "programs" (degree, location, program_type, ...). A type without categories is left out. The field "Filter types" of a list element overrides this for the element. Empty: every category type with categories, in the type order of the group.'
    category: academic.programs
    type: string
    default: ''
