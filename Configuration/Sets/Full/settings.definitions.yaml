# Site settings of the program page type, of the facts of a program, of the
# filters of the program list, of the content element header of the plugins and
# of the category trees editors pick the categories of a program from.
#
# Every path below but "categoryRootUids" is also assigned in
# "Configuration/TypoScript/constants.typoscript", and the default has to be the
# same in both files: a site that uses the site set and the static template
# reads the constants after the site settings, so a differing default resets
# what the integrator configured, silently. "categoryRootUids" is read by the
# backend alone, from the site configuration, so it has no constant.
#
# The file is declared with the aggregate set only - see "config.yaml" next to
# it for what that means for a site that depends on a single component.
categories:
  academic:
    label: 'Academic'
  academic.programs:
    label: 'Programs'
    parent: academic

settings:
  plugin.tx_academicprograms.page.layout:
    label: 'Program page | Page layout'
    description: 'The Fluid layout of the site package the program page renders its section "Main" into. The layout has to exist; only for "Default" does the extension bring a fallback, which renders the page without the frame of the site.'
    category: academic.programs
    type: string
    default: 'Default'
  plugin.tx_academicprograms.page.listPid:
    label: 'Program page | List page'
    description: 'The page the header of a program page links back to. 0 renders no link.'
    category: academic.programs
    type: int
    default: 0
  plugin.tx_academicprograms.facts.fields:
    label: 'Program facts | Facts of the program page and the details element'
    description: 'The facts the program page and the program details content element show, in this order, comma-separated: category type identifiers of the group "programs" (degree, standard_period, location, ...) and creditPoints, jobProfile, performanceScope, prerequisites. Empty: every category type, followed by the four program fields on the program page only.'
    category: academic.programs
    type: string
    default: ''
  plugin.tx_academicprograms.facts.mostSpecificOnly:
    label: 'Program facts | Most specific category only'
    description: 'Leaves a category out of the facts of the program page, the program details content element and the program card when the program also carries a descendant of it of the same category type: with "Bachelor" and its subcategory "Bachelor of Science" assigned, only "Bachelor of Science" is shown. Only assigned categories are compared, so a level that is not assigned breaks the line. Filters are not affected.'
    category: academic.programs
    type: bool
    default: false
  plugin.tx_academicprograms.card.fields:
    label: 'Program facts | Facts of the program card'
    description: 'The facts each program card of the program list shows, in this order, with the same identifiers as the facts of the program page. Empty shows the degree.'
    category: academic.programs
    type: string
    default: 'degree'
  plugin.tx_academicprograms.filter.categoryTypes:
    label: 'Program list and finder | Filter types'
    description: 'The category filters the program list offers, in this order, comma-separated: category type identifiers of the group "programs" (degree, location, program_type, ...). A type without categories is left out. The field "Filter types" of a list or finder element overrides this for the element. Empty: every category type with categories, in the type order of the group - and in the program finder the degree and the topic.'
    category: academic.programs
    type: string
    default: ''
  plugin.tx_academicprograms.filter.visibleCount:
    label: 'Program list | Visible filters'
    description: 'How many category filters the program list shows right away. The others are shown behind "More filters", which the visitor opens, and which is open while one of its filters is in use. 0 shows every filter. The program finder always shows all of its filters.'
    category: academic.programs
    type: int
    default: 0
  plugin.tx_academicprograms.filter.hideDisabledOptions:
    label: 'Program list and finder | Hide options without results'
    description: 'Leaves out the categories no listed program carries, instead of showing them as disabled options - in the program finder those no program in its storage carries. A selected category is always shown.'
    category: academic.programs
    type: bool
    default: false
  plugin.tx_academicprograms.filter.showActiveFilters:
    label: 'Program list | Active filter tags'
    description: 'Shows one tag per selected filter above the program list. Each tag links to the program list without that filter and keeps every other selection and the sorting.'
    category: academic.programs
    type: bool
    default: false
  plugin.tx_academicprograms.filter.showReset:
    label: 'Program list | Reset link'
    description: 'Shows a link that resets every filter, back to the program list as the content element presets it. Shown while the visitor has filtered.'
    category: academic.programs
    type: bool
    default: false
  plugin.tx_academicprograms.filter.showResultCount:
    label: 'Program list | Result count'
    description: 'Shows the number of programs found.'
    category: academic.programs
    type: bool
    default: false
  plugin.tx_academicprograms.categoryRootUids:
    label: 'Category trees | Root categories'
    description: 'The categories the category trees of program pages, of the program list and of the program finder start at, comma-separated uids. Editors are offered these categories and their subcategories only. Empty: the whole category tree.'
    category: academic.programs
    type: string
    default: ''
  plugin.tx_academicprograms.renderContentElementHeader:
    label: 'Render the content element header in the plugins'
    description: 'Only for a site whose content element layout renders no header. The layouts of EXT:fluid_styled_content and of the bootstrap package render it, and switched on there the header appears twice.'
    category: academic.programs
    type: bool
    default: false
