# The route enhancer of the program list moved to
# "Configuration/Routes/List.yaml", next to the route files of the other
# academic extensions. This file imports it, so a site configuration that
# imports this path keeps working and gets the filter routes as well:
#
#   imports:
#     - resource: 'EXT:academic_programs/Configuration/Yaml/Routes.yaml'
#
# Import "Configuration/Routes/List.yaml" in a new site configuration.
imports:
  - resource: 'EXT:academic_programs/Configuration/Routes/List.yaml'
