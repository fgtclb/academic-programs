<html
    lang="en"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
    data-namespace-typo3-fluid="true"
>

<f:comment>
    A project override written before the filter types existed: it renders the filter partial
    with the arguments it knows of rather than with `{_all}`, so `filterTypes` does not reach it.
</f:comment>
<f:form action="list" name="demand" object="{demand}" class="academic-programs-filtersorting">
    <div class="row">
        <f:render partial="Program/DemandCategories" arguments="{categories: categories, demand: demand, settings: settings}"/>
    </div>
</f:form>

</html>
