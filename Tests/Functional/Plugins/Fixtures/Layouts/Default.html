<html
    data-namespace-typo3-fluid="true"
    xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
>
<f:comment>
    The content element layout of a site package that renders no header: the element
    templates of such a site render the header themselves. The id is the one the layout of
    EXT:fluid_styled_content gives the frame, so a test finds the element either way.
</f:comment>
<div id="c{data.uid}" class="frame-without-header">
    <f:render section="Main" optional="true" />
</div>
</html>
